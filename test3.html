<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>test3</title>
<style>
html,body{margin:0;padding:0;background:#ff00ff;width:1920px;height:1920px;overflow:hidden}
#stage{width:1920px;height:1920px;display:flex;align-items:center;justify-content:center;background:#ff00ff}
img{display:block;max-width:1920px;max-height:1920px;width:auto;height:auto}

<body data-status="loading"><div id="stage"><img id="photo" src="https://wsrv.nl/?url=allproductcleaningnw.com/wp-content/uploads/2016/04/allpro-slide11.jpg&amp;w=1920&amp;output=png" alt=""></div>
<script>
var img=document.getElementById('photo');
function done(){document.body.setAttribute('data-status','loaded');}
if(img.complete){done();}else{img.addEventListener('load',done);img.addEventListener('error',done);}
</script>
</body></html>
